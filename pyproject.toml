[project]
name = "clauselens"
version = "0.1.0"
description = "AI-powered contract intelligence: extract, explain, and cite key lease terms."
readme = "README.md"
authors = [
    { name = "Rohan", email = "rohanbhatia003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.142.1",
    "google-genai>=2.33.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
clauselens = "clauselens:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
